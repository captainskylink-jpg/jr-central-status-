<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JR東海 運行情報</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-top: 0;
    }

    #updated {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }

    #lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line {
      background: white;
      border-radius: 6px;
      padding: 14px 16px;
      border: 1px solid #ddd;
    }

    .line-name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .line-status {
      font-size: 15px;
      font-weight: bold;
    }

    .normal {
      color: #008000;
    }

    .delay {
      color: #d07000;
    }

    .suspend {
      color: #d00000;
    }

    .detail {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    #error {
      color: #d00000;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>JR東海 運行情報</h1>

  <div id="updated">
    データ取得中...
  </div>

  <div id="lines"></div>

  <div id="error"></div>


  <script>

    // JR東海の運行情報を加工して返してくれるWorker
    const WORKER_URL =
      "https://jr-central-fetch.hashizume-customize.workers.dev/";


    // Workerからデータを取得
    async function loadTrainInfo() {

      const linesElement = document.getElementById("lines");
      const updatedElement = document.getElementById("updated");
      const errorElement = document.getElementById("error");

      try {

        // Workerへアクセス
        const response = await fetch(WORKER_URL);

        // HTTPエラーなら停止
        if (!response.ok) {
          throw new Error(
            "Workerからデータを取得できませんでした"
          );
        }

        // JSONとして読み込む
        const data = await response.json();

        console.log("取得したデータ:", data);


        // 更新日時
        updatedElement.textContent =
          "JR東海データ取得日: " + data.createTime;


        // 一旦表示を空にする
        linesElement.innerHTML = "";


        // 13路線を1つずつ処理
        data.lines.forEach(line => {

          // 路線全体
          const lineElement = document.createElement("div");
          lineElement.className = "line";


          // 路線名
          const nameElement = document.createElement("div");
          nameElement.className = "line-name";
          nameElement.textContent = line.name;


          // 運行状態
          const statusElement = document.createElement("div");
          statusElement.className =
            "line-status " + line.status;

          statusElement.textContent = line.text;


          // 詳細情報
          const detailElement = document.createElement("div");
          detailElement.className = "detail";
          detailElement.textContent = line.detail;


          // 路線名 → 状態 → 詳細
          lineElement.appendChild(nameElement);
          lineElement.appendChild(statusElement);

          if (line.detail) {
            lineElement.appendChild(detailElement);
          }


          // 完成した路線を画面に追加
          linesElement.appendChild(lineElement);

        });

      } catch (error) {

        console.error(error);

        errorElement.textContent =
          "運行情報を取得できませんでした。";

      }
    }


    // ページを開いたら取得
    loadTrainInfo();

  </script>

</body>
</html>
